<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборды KT&amp;G</title>
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#15181a;--ink2:#4a5056;--mut:#7c838a;--line:#e1e4df;--acc:#1d4fc4;--acc-soft:#e6ecfb;--ok:#0b7a3b;--ok-soft:#e5f4e3;--warn-soft:#fdf1d4;--lock:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#111314;--card:#1a1c1d;--ink:#eef0ee;--ink2:#b6bbb8;--mut:#8a908d;--line:#2c3031;--acc:#7ea2ff;--acc-soft:#1e2a45;--ok:#6fd49a;--ok-soft:#16301a;--warn-soft:#3a2f12;--lock:#e7b75a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:32px 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
h1{font-size:28px;margin:4px 0 6px}
.lede{color:var(--ink2);max-width:70ch;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--acc);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:18px;font-weight:700;line-height:1.25}
.alias{font-size:12px;color:var(--mut);margin-top:2px}
.badge{flex:0 0 auto;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-pass{background:var(--warn-soft);color:var(--lock)}
.b-open{background:var(--ok-soft);color:var(--ok)}
.b-priv{background:var(--acc-soft);color:var(--acc)}
.what{color:var(--ink2);font-size:14px;margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:13px}
dt{color:var(--mut)}dd{margin:0}
.go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.go b{color:var(--acc)}
.when{color:var(--mut);font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:12.5px;margin-top:22px;max-width:80ch}
</style>
</head>
<body>
<div id="lockScreen" style="min-height:70vh;display:flex;align-items:center;justify-content:center">
  <form id="lockForm" autocomplete="off" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:340px;display:grid;gap:12px">
    <div class="eyebrow">Аналитика KT&amp;G · меню</div>
    <div style="font-size:20px;font-weight:700">Дашборды</div>
    <input id="lockPass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required
      style="font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)">
    <button id="lockBtn" type="submit" style="font:inherit;font-size:15px;font-weight:600;padding:10px;border:0;border-radius:8px;background:#c5ef9a;color:#1f3a0a;cursor:pointer">Открыть</button>
    <div id="lockErr" hidden style="color:#d03b3b;font-size:13px">Пароль не подошёл</div>
  </form>
</div>

<script>
(function(){
  const pl=document.getElementById('payload'), meta=JSON.parse(pl.dataset.meta);
  const b64=s=>{const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  const scr=document.getElementById('lockScreen'), form=document.getElementById('lockForm'), inp=document.getElementById('lockPass'),
        btn=document.getElementById('lockBtn'), err=document.getElementById('lockErr');
  async function unlock(pass){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(meta.s),iterations:meta.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(meta.i)},key,b64(pl.textContent.trim()));
    const p=JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
    pl.remove(); scr.remove();
    const box=document.createElement('div'); box.innerHTML=p.html; while(box.firstChild) document.body.appendChild(box.firstChild);
    p.js.forEach(t=>{ const s=document.createElement('script'); s.textContent=t; document.body.appendChild(s); });
  }
  let saved=null; try{saved=sessionStorage.getItem('menu-pass');}catch(e){}
  const quiet=async()=>{ if(!saved) return false; try{ await unlock(saved); return true; }catch(e){ try{sessionStorage.removeItem('menu-pass');}catch(_){} return false; } };
  quiet().then(ok=>{ if(ok) return; inp.focus();
    form.onsubmit=async ev=>{ ev.preventDefault(); err.hidden=true; btn.disabled=true; btn.textContent='Проверяю…';
      try{ await unlock(inp.value); try{sessionStorage.setItem('menu-pass',inp.value);}catch(e){} }
      catch(e){ err.hidden=false; btn.disabled=false; btn.textContent='Открыть'; inp.select(); } };
  });
})();
</script>
